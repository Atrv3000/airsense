<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AirSense — Mumbai GIS Air Quality & Hotspots</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b1120;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Modern Floating Minimal Top Bar */
        .floating-topbar {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 10px 16px;
            border-radius: 16px;
            border: 1px solid rgba(51, 65, 85, 0.7);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 10px #38bdf8;
        }

        .brand-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #f8fafc;
            letter-spacing: -0.3px;
        }

        .metrics-pills {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .pill-badge {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(51, 65, 85, 0.8);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 0.74rem;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #94a3b8;
            font-weight: 600;
        }

        .pill-badge b {
            color: #f8fafc;
            font-weight: 800;
        }

        #map {
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: #0b1120;
        }

        /* Marker Badges */
        .aqi-marker-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: #ffffff;
            font-weight: 900;
            font-size: 0.88rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.45);
            border: 2.5px solid #ffffff;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .aqi-marker-pin.dark-text {
            color: #0f172a !important;
            border: 2.5px solid #0f172a !important;
            font-weight: 900 !important;
        }

        .aqi-marker-pin:hover {
            transform: scale(1.18);
        }

        /* Floating Modern Glass Legend */
        .floating-legend {
            position: absolute;
            bottom: 24px;
            left: 12px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid rgba(51, 65, 85, 0.7);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            max-width: 280px;
        }

        .legend-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #94a3b8;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .legend-strip {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .legend-step {
            height: 6px;
            flex: 1;
            border-radius: 3px;
        }

        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.66rem;
            color: #64748b;
            margin-top: 4px;
            font-weight: 600;
        }

        /* Clean Popups */
        .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.95) !important;
            backdrop-filter: blur(12px) !important;
            color: #f8fafc !important;
            border-radius: 16px !important;
            padding: 2px !important;
            box-shadow: 0 16px 36px rgba(0,0,0,0.55) !important;
            border: 1px solid rgba(51, 65, 85, 0.9);
        }

        .leaflet-popup-tip {
            background: #0f172a !important;
        }

        .popup-box {
            padding: 12px 14px;
            min-width: 210px;
        }

        .popup-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .popup-title {
            font-size: 0.92rem;
            font-weight: 800;
            color: #f8fafc;
        }

        .popup-tag {
            padding: 3px 8px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.76rem;
        }

        .popup-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: rgba(11, 17, 32, 0.85);
            padding: 8px 10px;
            border-radius: 10px;
            margin: 8px 0;
            border: 1px solid rgba(51, 65, 85, 0.5);
        }

        .popup-cell {
            font-size: 0.7rem;
            color: #94a3b8;
        }

        .popup-cell span {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: #f8fafc;
            margin-top: 2px;
        }

        .popup-forecast {
            border-top: 1px solid rgba(51, 65, 85, 0.6);
            padding-top: 8px;
            margin-top: 6px;
        }

        .forecast-label {
            font-size: 0.68rem;
            color: #38bdf8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .forecast-chips {
            display: flex;
            gap: 5px;
        }

        .fc-chip {
            background: rgba(11, 17, 32, 0.85);
            border: 1px solid rgba(51, 65, 85, 0.6);
            border-radius: 8px;
            padding: 4px 6px;
            text-align: center;
            flex: 1;
            font-size: 0.68rem;
        }

        .fc-chip .time { color: #94a3b8; }
        .fc-chip .val { font-weight: 800; margin-top: 2px; }

        /* Leaflet custom control restyling */
        .leaflet-control-layers {
            background: rgba(15, 23, 42, 0.9) !important;
            backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(51, 65, 85, 0.8) !important;
            border-radius: 12px !important;
            color: #f8fafc !important;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4) !important;
            font-size: 0.78rem !important;
            margin-top: 70px !important;
            margin-right: 12px !important;
        }

        .leaflet-control-layers-base label,
        .leaflet-control-layers-overlays label {
            color: #cbd5e1 !important;
            font-weight: 500 !important;
        }

        .leaflet-top.leaflet-left {
            margin-top: 65px !important;
            margin-left: 2px !important;
        }

        .leaflet-bar a {
            background-color: rgba(15, 23, 42, 0.9) !important;
            color: #f8fafc !important;
            border-bottom: 1px solid #334155 !important;
        }
    </style>
</head>
<body>

    <!-- Minimal Floating Top HUD -->
    <div class="floating-topbar">
        <div class="brand-section">
            <div class="brand-dot"></div>
            <div class="brand-title">Mumbai AQI GIS</div>
        </div>
        <div class="metrics-pills">
            <div class="pill-badge">
                Stations: <b id="stat-stations">--</b>
            </div>
            <div class="pill-badge">
                City Avg: <b id="stat-city-aqi" style="color: #38bdf8;">--</b>
            </div>
        </div>
    </div>

    <!-- Map Canvas -->
    <div id="map"></div>

    <!-- Floating Elegant Legend -->
    <div class="floating-legend">
        <div class="legend-title">CPCB NAQI Index</div>
        <div class="legend-strip">
            <div class="legend-step" style="background: #00B050;" title="Good (0-50)"></div>
            <div class="legend-step" style="background: #92D050;" title="Satisfactory (51-100)"></div>
            <div class="legend-step" style="background: #F59E0B;" title="Moderate (101-200)"></div>
            <div class="legend-step" style="background: #FF9900;" title="Poor (201-300)"></div>
            <div class="legend-step" style="background: #FF0000;" title="Very Poor (301-400)"></div>
            <div class="legend-step" style="background: #C00000;" title="Severe (401-500)"></div>
        </div>
        <div class="legend-labels">
            <span>Good (0)</span>
            <span>Moderate (150)</span>
            <span>Severe (500)</span>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Center map precisely over Mumbai Peninsula
        const map = L.map('map', {
            center: [19.0760, 72.8777],
            zoom: 11,
            zoomControl: true,
            attributionControl: false
        });

        // 2. Basemap options: Dark CartoDB (default sleek) and Standard OSM
        const cartoDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        const osmStandard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        });

        const stationsLayer = L.featureGroup().addTo(map);
        const hotspotsLayer = L.featureGroup().addTo(map);

        // 3. Fetch Map Layers from Backend API
        fetch('/api/v1/gis/map-layers/?threshold=140')
            .then(res => res.json())
            .then(data => {
                const stations = data.stations_geojson.features || [];
                const hotspots = data.hotspots_geojson.features || [];

                document.getElementById('stat-stations').innerText = stations.length;

                let aqiSum = 0;
                let validCount = 0;

                // Render Station Pins
                stations.forEach(st => {
                    const coords = st.geometry.coordinates; // [lon, lat]
                    const p = st.properties;
                    const lat = coords[1];
                    const lon = coords[0];

                    if (p.current_aqi) {
                        aqiSum += p.current_aqi;
                        validCount++;
                    }

                    // Contrast detection for pin labels
                    const aqiColor = p.color_hex || '#38bdf8';
                    const isLightBg = p.category === 'Moderate' || p.category === 'Satisfactory' || aqiColor.toUpperCase() === '#FFFF00' || aqiColor.toUpperCase() === '#92D050';
                    const textClass = isLightBg ? 'aqi-marker-pin dark-text' : 'aqi-marker-pin';

                    const customIcon = L.divIcon({
                        className: '',
                        html: `<div class="${textClass}" style="background-color: ${aqiColor};">${Math.round(p.current_aqi)}</div>`,
                        iconSize: [44, 44],
                        iconAnchor: [22, 22]
                    });

                    // Build 4h Forecast Chips
                    let forecastHtml = '';
                    if (p.forecast_24h && p.forecast_24h.length > 0) {
                        const next4 = p.forecast_24h.slice(0, 4);
                        forecastHtml = `
                            <div class="popup-forecast">
                                <div class="forecast-label">Forecast (Next 4h)</div>
                                <div class="forecast-chips">
                                    ${next4.map(fc => `
                                        <div class="fc-chip">
                                            <div class="time">+${fc.step_ahead_hours}h</div>
                                            <div class="val" style="color: ${fc.color_hex};">${Math.round(fc.predicted_aqi)}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }

                    const tagTextColor = isLightBg ? '#0f172a' : '#ffffff';
                    const popupContent = `
                        <div class="popup-box">
                            <div class="popup-header">
                                <div class="popup-title">${p.name}</div>
                                <div class="popup-tag" style="background-color: ${aqiColor}; color: ${tagTextColor};">
                                    ${Math.round(p.current_aqi)} ${p.category}
                                </div>
                            </div>
                            <div class="popup-grid">
                                <div class="popup-cell">PM2.5<span>${p.pm25 ? p.pm25 + ' µg' : '--'}</span></div>
                                <div class="popup-cell">PM10<span>${p.pm10 ? p.pm10 + ' µg' : '--'}</span></div>
                                <div class="popup-cell">Prominent<span>${p.prominent_pollutant || 'PM2.5'}</span></div>
                                <div class="popup-cell">Temp<span>${p.temperature ? p.temperature + '°C' : '--'}</span></div>
                            </div>
                            ${forecastHtml}
                        </div>
                    `;

                    L.marker([lat, lon], { icon: customIcon })
                        .bindPopup(popupContent)
                        .addTo(stationsLayer);
                });

                if (validCount > 0) {
                    document.getElementById('stat-city-aqi').innerText = Math.round(aqiSum / validCount);
                }

                // Render Landmass-Clipped Smooth Hotspot Halos
                const hotspotPoints = hotspots.filter(hs => hs.geometry.type === 'Point');

                hotspotPoints.forEach(pt => {
                    const coords = pt.geometry.coordinates; // [lon, lat]
                    const lat = coords[1];
                    const lon = coords[0];
                    const p = pt.properties;
                    const aqi = p.interpolated_aqi;
                    const color = p.color_hex || '#ff4d4f';

                    // Layer 1: Soft Ambient Diffusion (1600m)
                    L.circle([lat, lon], {
                        radius: 1600,
                        stroke: false,
                        fillColor: color,
                        fillOpacity: 0.08,
                        interactive: false
                    }).addTo(hotspotsLayer);

                    // Layer 2: Core Concentration Halo (800m)
                    L.circle([lat, lon], {
                        radius: 800,
                        color: color,
                        weight: 1.2,
                        opacity: 0.45,
                        fillColor: color,
                        fillOpacity: 0.22,
                        interactive: true
                    }).bindTooltip(`<b>Hotspot Zone</b><br>AQI: ${aqi} (${p.category})`, {
                        sticky: true,
                        direction: 'top'
                    }).addTo(hotspotsLayer);
                });

                // Layer Toggle Control
                const baseMaps = {
                    "Dark Mode": cartoDark,
                    "Street Map": osmStandard
                };
                const overlayMaps = {
                    "Stations": stationsLayer,
                    "Hotspots": hotspotsLayer
                };
                L.control.layers(baseMaps, overlayMaps, { position: 'topright', collapsed: true }).addTo(map);
            })
            .catch(err => {
                console.error("Failed to load map layers:", err);
            });
    </script>
</body>
</html>
